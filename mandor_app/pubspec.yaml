name: mandor_app
description: Aplikasi Mandor - PT Krakatau Indah
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.0
  mobile_scanner: ^5.2.3
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  # Export Excel & PDF
  excel: ^4.0.6
  pdf: ^3.11.1
  path_provider: ^2.1.4
  open_file: ^3.5.7
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1E40AF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter:
  uses-material-design: true
  generate: true
